# --sequence.seed は外さない: vdelta 0.10.0 は vitest の resolved sequence.seed（既定 Date.now()）を
# instrument.config_digest に含めるため、seed 未固定だと red run と green run が別 instrument 扱いになり
# `vdelta compare` が常に baseline-missing で棄権する（verdict が一度も出ない）。shuffle 無効時は
# vitest 自身が seed を使わないので、固定しても test 実行結果は変わらない。
test_cmd=npx vdelta run --report json -- npx vitest run --sequence.seed=1
verdict_cmd=npx vdelta compare --report json
